<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491">
<rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="4"/>
<text x="527" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#a57a37">NOVENA DE</text><text x="527" y="142" text-anchor="middle" font-family="Georgia,serif" font-size="53" font-weight="700" fill="#442116">SÃO FRANCISCO DE ASSIS</text>
<rect x="205" y="190" width="210" height="62" rx="30" fill="#52602f"/><text x="310" y="233" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#fff">DIA 1</text>
<text x="100" y="335" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#442116">O jovem Francisco de Assis</text>
<circle cx="830" cy="285" r="120" fill="#e5c88d"/><circle cx="840" cy="235" r="36" fill="#c99568"/><path d="M805 230 C818 190 862 190 875 228 C855 214 830 212 805 230Z" fill="#4c2f25"/><path d="M780 300 Q835 260 900 305 L890 385 L780 385Z" fill="#7b3f2c"/>
<g font-family="Georgia,serif" fill="#4a2a1c">
<text x="100" y="470" font-size="34" font-weight="700" fill="#314325">Um pouco da história</text>
<text x="100" y="515" font-size="25">Francisco nasceu em Assis, na Itália, em uma família abastada. Quando jovem,</text><text x="100" y="548" font-size="25">gostava das festas, dos amigos e sonhava em ser cavaleiro. Mesmo cercado de</text><text x="100" y="581" font-size="25">confortos, Deus já preparava em seu coração um caminho de transformação,</text><text x="100" y="614" font-size="25">simplicidade e amor.</text>
<text x="100" y="700" font-size="34" font-weight="700" fill="#314325">Palavra de Deus</text>
<text x="100" y="744" font-size="25" font-style="italic">“Vai, vende tudo o que tens, dá aos pobres... depois vem e segue-me.”</text><text x="100" y="777" font-size="24">(cf. Mt 19,21)</text>
<text x="100" y="860" font-size="34" font-weight="700" fill="#314325">Reflexão</text>
<text x="100" y="904" font-size="25">Antes de ser santo, Francisco foi um jovem como tantos outros, com sonhos e</text><text x="100" y="937" font-size="25">desejos. A santidade começou quando ele permitiu que Deus transformasse seu</text><text x="100" y="970" font-size="25">coração. Também nós somos chamados a escutar a voz do Senhor e confiar em seus planos.</text>
<text x="100" y="1053" font-size="34" font-weight="700" fill="#314325">Intenção do dia</text>
<text x="100" y="1097" font-size="25">Peçamos a graça de abrir o coração à vontade de Deus e de reconhecer que a</text><text x="100" y="1130" font-size="25">verdadeira alegria nasce do amor do Senhor.</text>
<text x="100" y="1212" font-size="34" font-weight="700" fill="#314325">Oração</text>
<text x="100" y="1256" font-size="25">São Francisco de Assis, ajudai-me a buscar a Deus com sinceridade, a desapegar-me</text><text x="100" y="1289" font-size="25">do que me afasta do Evangelho e a caminhar com humildade, paz e confiança. Amém.</text>
</g>
<rect x="70" y="1340" width="425" height="92" rx="14" fill="#f4e6c6" stroke="#a57a37" stroke-width="2"/><text x="95" y="1378" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#4a2a1c">Rezar também:</text><text x="95" y="1410" font-family="Georgia,serif" font-size="22" fill="#4a2a1c">Pai-Nosso, Ave-Maria e Glória.</text>
<rect x="530" y="1340" width="455" height="92" rx="14" fill="#f4e6c6" stroke="#a57a37" stroke-width="2"/><text x="555" y="1378" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#314325">Vivendo como Francisco:</text><text x="555" y="1410" font-family="Georgia,serif" font-size="21" fill="#4a2a1c">Agradeça a Deus pela sua vida e entregue a Ele seus planos.</text>
</svg>