<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491"><rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="5"/><text x="527.5" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#b18a4c">✝</text><text x="527.5" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="50" fill="#b18a4c">DIA 1</text><text x="527.5" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-weight="700" fill="#4a2416">O jovem Francisco de Assis</text><text x="105" y="465" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Um pouco da história</text><text x="105" y="525" font-family="Georgia,serif" font-size="29" fill="#4a2416"><tspan x="105">Francisco nasceu em Assis, na Itália, em uma família abastada.</tspan><tspan x="105" dy="44">Quando jovem, gostava das festas, dos amigos e sonhava em ser</tspan><tspan x="105" dy="44">cavaleiro. Deus já preparava em seu coração um caminho novo.</tspan></text><text x="105" y="750" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Palavra de Deus</text><text x="105" y="810" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#4a2416">“Vai, vende tudo o que tens, dá aos pobres... depois vem e segue-me.”</text><text x="105" y="855" font-family="Georgia,serif" font-size="34" fill="#4a2416">(cf. Mt 19,21)</text><text x="105" y="990" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Reflexão</text><text x="105" y="1050" font-family="Georgia,serif" font-size="29" fill="#4a2416"><tspan x="105">A santidade começou quando Francisco permitiu que Deus</tspan><tspan x="105" dy="44">transformasse seu coração. Também nós somos chamados a confiar.</tspan></text></svg>