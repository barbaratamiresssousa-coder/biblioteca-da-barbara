<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca da Bárbara</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff8fb;color:#33222a}
  .novena-bar{background:linear-gradient(135deg,#fff7fb,#f8e8ef);border-bottom:1px solid #ead2dc;padding:14px}
  .novena-card{max-width:980px;margin:auto;display:flex;gap:14px;align-items:center;background:white;border:1px solid #efdbe4;border-radius:18px;padding:14px;box-shadow:0 6px 24px rgba(95,50,70,.08)}
  .cover{width:72px;height:96px;border-radius:10px;background:linear-gradient(180deg,#234f77,#0f2741);color:white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;padding:7px;flex:none}
  .info{min-width:0;flex:1}
  .info h2{font-size:17px;margin:0 0 5px}.info p{font-size:13px;margin:2px 0;color:#6a515d}
  .price{font-weight:700;color:#a52f63;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .btn{display:inline-block;text-decoration:none;border-radius:999px;padding:9px 13px;font-weight:700;font-size:13px}
  .preview{background:#a52f63;color:white}.openlib{background:#f4e5eb;color:#6e2947}
  .frame{width:100%;height:calc(100vh - 154px);border:0;display:block;background:white}
  @media(max-width:600px){.novena-card{align-items:flex-start}.cover{width:62px;height:84px}.info h2{font-size:15px}.frame{height:calc(100vh - 178px)}}
</style>
</head>
<body>
<section class="novena-bar">
  <div class="novena-card">
    <div class="cover">NOVENA<br>NOSSA SENHORA<br>APARECIDA</div>
    <div class="info">
      <h2>Novena de Nossa Senhora Aparecida – Padroeira do Brasil</h2>
      <p>9 dias de oração, fé e confiança.</p>
      <p class="price">R$ 19,90</p>
      <div class="actions">
        <a class="btn preview" href="Novena_Nossa_Senhora_Aparecida_19,90.pdf#page=1" target="_blank" rel="noopener">Ver prévia</a>
        <a class="btn openlib" href="index(2).html" target="_blank" rel="noopener">Abrir biblioteca</a>
      </div>
    </div>
  </div>
</section>
<iframe class="frame" src="index(2).html" title="Biblioteca da Bárbara"></iframe>
</body>
</html>
