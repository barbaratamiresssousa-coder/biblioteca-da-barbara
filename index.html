<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca da Bárbara</title>
<style>html,body{margin:0;background:#fff;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#14355d}</style>
</head>
<body><div id="loading">Abrindo a Biblioteca da Bárbara…</div>
<script>
(async()=>{
  try{
    const response=await fetch('index(2).html',{cache:'no-store'});
    if(!response.ok) throw new Error('Não foi possível abrir a biblioteca.');
    let html=await response.text();

    const marker='const BOOKS=';
    const start=html.indexOf(marker);
    if(start<0) throw new Error('Lista de livros não encontrada.');
    const arrayStart=start+marker.length;
    const arrayEnd=html.indexOf('];',arrayStart);
    if(arrayEnd<0) throw new Error('Fim da lista de livros não encontrado.');
    const current=html.slice(arrayStart,arrayEnd+1);
    let list=JSON.parse(current);
    list=list.filter(b=>b.id!=="novena-sao-francisco-de-assis");
    list.unshift({"id":"novena-sao-francisco-de-assis","title":"Novena de São Francisco de Assis","subtitle":"9 dias de fé, paz e simplicidade","tag":"Novena","meta":["9 dias","São Francisco de Assis","Oração e reflexão"],"detail_lines":[["Formato","Novena de 9 dias"],["Tema","Fé, paz e simplicidade"],["Conteúdo","História, Palavra de Deus, reflexão, intenção e oração"]],"description":"Uma novena de 9 dias inspirada na vida e na espiritualidade de São Francisco de Assis, com história, Palavra de Deus, reflexões, intenções, orações e propósitos diários. Para rezar juntamente com o Santo Terço.","price":"R$ 19,90","cover":"capa_novena_sao_francisco.svg","pages":["preview_sao_francisco_1.svg","preview_sao_francisco_2.svg","preview_sao_francisco_3.svg","preview_sao_francisco_4.svg","preview_sao_francisco_5.svg"],"buy":"https://wa.me/5589981099602?text=Ol%C3%A1%2C%20B%C3%A1rbara!%20Quero%20adquirir%20a%20Novena%20de%20S%C3%A3o%20Francisco%20de%20Assis%20em%20PDF%20por%20R%24%2019%2C90."});
    html=html.slice(0,arrayStart)+JSON.stringify(list)+html.slice(arrayEnd+1);

    const PHYSICALS={"novena-nossa-senhora-aparecida":{"price":"R$ 49,90","url":"https://wa.me/5589981099602?text=Ol%C3%A1%2C%20B%C3%A1rbara!%20Quero%20adquirir%20o%20livro%20f%C3%ADsico%20Novena%20de%20Nossa%20Senhora%20Aparecida%20por%20R%24%2049%2C90."},"novena-sao-francisco-de-assis":{"price":"R$ 49,90","url":"https://wa.me/5589981099602?text=Ol%C3%A1%2C%20B%C3%A1rbara!%20Quero%20adquirir%20o%20livro%20f%C3%ADsico%20Novena%20de%20S%C3%A3o%20Francisco%20de%20Assis%20por%20R%24%2049%2C90."}};
    html=html.replace('const BOOKS=','const PHYSICALS='+JSON.stringify(PHYSICALS)+';const BOOKS=');

    html=html.replace(
      'function renderBooks(){grid.innerHTML=BOOKS.map(book=>\`<article class="book-card">',
      'function renderBooks(){grid.innerHTML=BOOKS.map(book=>\`<article class="book-card" id="\${book.id}">'
    );

    html=html.replace(
      '<div class="price-box"><span>PDF</span><strong>\${book.price}</strong></div><div class="actions">',
      '<div class="price-box"><span>PDF</span><strong>\${book.price}</strong>\${PHYSICALS[book.id]?\`<div style="margin-top:7px;font-size:14px;font-weight:800;color:#7a4a34">Livro físico — \${PHYSICALS[book.id].price}</div>\`:""}</div><div class="actions">'
    );

    html=html.replace(
      '<a class="btn gold buy" href="\${book.buy}" target="_blank" rel="noopener">Adquirir PDF</a></div></div></article>\`',
      '<a class="btn gold buy" href="\${book.buy}" target="_blank" rel="noopener">Adquirir PDF</a>\${PHYSICALS[book.id]?\`<a class="btn ghost" href="\${PHYSICALS[book.id].url}" target="_blank" rel="noopener">Adquirir livro físico</a>\`:""}<button class="btn ghost share-book" type="button" data-share="\${book.id}">Compartilhar</button></div></div></article>\`'
    );

    html=html.replace(
      "grid.querySelectorAll('[data-read]').forEach(btn=>btn.addEventListener('click',()=>openReader(btn.dataset.read)))}",
      "grid.querySelectorAll('[data-read]').forEach(btn=>btn.addEventListener('click',()=>openReader(btn.dataset.read)));grid.querySelectorAll('[data-share]').forEach(btn=>btn.addEventListener('click',()=>shareBook(btn.dataset.share)))}"
    );

    html=html.replace(
      'function getBook(id){return BOOKS.find(b=>b.id===id)}',
      'function shareBook(id){const book=getBook(id);if(!book)return;const url=location.href.split("#")[0]+"#"+id;const data={title:book.title,text:"Veja este livro na Biblioteca da Bárbara: "+book.title,url};if(navigator.share){navigator.share(data).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>alert("Link do livro copiado!"));}else{prompt("Copie o link deste livro:",url);}}function getBook(id){return BOOKS.find(b=>b.id===id)}'
    );

    html=html.replace(
      '<div class="detail-price"><small>Versão disponível</small><strong>PDF - R$ 39,90</strong></div><div class="actions"><button class="btn primary" id="readFromDetails">Ler prévia</button><a class="btn gold buy" id="buyFromDetails" href="#" target="_blank" rel="noopener">Adquirir PDF</a></div>',
      '<div class="detail-price"><small>Versão disponível</small><strong id="detailPdfPrice">PDF</strong><strong id="detailPhysicalPrice" style="display:none;font-size:19px;margin-top:6px"></strong></div><div class="actions"><button class="btn primary" id="readFromDetails">Ler prévia</button><a class="btn gold buy" id="buyFromDetails" href="#" target="_blank" rel="noopener">Adquirir PDF</a><a class="btn ghost" id="buyPhysicalFromDetails" href="#" target="_blank" rel="noopener" style="display:none">Adquirir livro físico</a><button class="btn ghost" id="shareFromDetails" type="button">Compartilhar</button></div>'
    );

    html=html.replace(
      'buyFromDetails.href=currentBook.buy;details.classList.add',
      'buyFromDetails.href=currentBook.buy;document.getElementById("detailPdfPrice").textContent="PDF - "+currentBook.price;const physicalPrice=document.getElementById("detailPhysicalPrice"),physicalBuy=document.getElementById("buyPhysicalFromDetails"),physical=PHYSICALS[currentBook.id];if(physical){physicalPrice.textContent="Livro físico - "+physical.price;physicalPrice.style.display="block";physicalBuy.href=physical.url;physicalBuy.style.display="inline-flex";}else{physicalPrice.style.display="none";physicalBuy.style.display="none";}details.classList.add'
    );

    html=html.replace(
      "readFromDetails.addEventListener('click',()=>currentBook&&openReader(currentBook.id));readerClose.addEventListener",
      "readFromDetails.addEventListener('click',()=>currentBook&&openReader(currentBook.id));document.getElementById('shareFromDetails').addEventListener('click',()=>currentBook&&shareBook(currentBook.id));readerClose.addEventListener"
    );

    html=html.replaceAll('Adquirir PDF · R$ 39,90','Adquirir PDF · \${book.price}');
    html=html.replaceAll('Quero o livro completo · R$ 39,90','Quero o livro completo · \${book.price}');

    html=html.replace(
      'year.textContent=new Date().getFullYear();renderBooks();',
      'year.textContent=new Date().getFullYear();renderBooks();if(location.hash){const sharedId=decodeURIComponent(location.hash.slice(1));if(getBook(sharedId))setTimeout(()=>openDetails(sharedId),0);}'
    );

    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('loading').textContent='Não foi possível abrir a biblioteca agora. Atualize a página e tente novamente.';
  }
})();
</script></body></html>
