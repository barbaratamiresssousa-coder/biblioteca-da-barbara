<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca da Bárbara</title>
<style>html,body{margin:0;background:#fff;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#14355d}</style>
</head>
<body><div id="loading">Abrindo a Biblioteca da Bárbara…</div>
<script>
(async()=>{
  try{
    const response=await fetch('index(2).html',{cache:'no-store'});
    if(!response.ok) throw new Error('Não foi possível abrir a biblioteca.');
    let html=await response.text();
    
    const marker='const BOOKS=';
    const start=html.indexOf(marker);
    if(start<0) throw new Error('Lista de livros não encontrada.');
    const arrayStart=start+marker.length;
    const arrayEnd=html.indexOf('];',arrayStart);
    if(arrayEnd<0) throw new Error('Fim da lista de livros não encontrado.');
    const current=html.slice(arrayStart,arrayEnd+1);
    let list=JSON.parse(current);
    list=list.filter(b=>b.id!=="novena-nossa-senhora-aparecida");
    html=html.slice(0,arrayStart)+JSON.stringify(list)+html.slice(arrayEnd+1);

    const PHYSICAL_URL='https://wa.me/5589981099602?text=Ol%C3%A1%2C%20B%C3%A1rbara%21%20Quero%20adquirir%20o%20livro%20f%C3%ADsico%20Novena%20de%20Nossa%20Senhora%20Aparecida%20por%20R%24%2049%2C90.';

    html=html.replace(
      'function renderBooks(){grid.innerHTML=BOOKS.map(book=>\`<article class="book-card">',
      'function renderBooks(){grid.innerHTML=BOOKS.map(book=>\`<article class="book-card" id="\${book.id}">'
    );

    html=html.replace(
      '<div class="price-box"><span>PDF</span><strong>\${book.price}</strong></div><div class="actions">',
      '<div class="price-box"><span>PDF</span><strong>\${book.price}</strong>\${book.id==="novena-nossa-senhora-aparecida"?\`<div style="margin-top:7px;font-size:14px;font-weight:800;color:#7a4a34">Livro físico — R$ 49,90</div>\`:""}</div><div class="actions">'
    );

    html=html.replace(
      '<a class="btn gold buy" href="\${book.buy}" target="_blank" rel="noopener">Adquirir PDF</a></div></div></article>\`',
      '<a class="btn gold buy" href="\${book.buy}" target="_blank" rel="noopener">Adquirir PDF</a>\${book.id==="novena-nossa-senhora-aparecida"?\`<a class="btn ghost" href="'+PHYSICAL_URL+'" target="_blank" rel="noopener">Adquirir livro físico</a>\`:""}<button class="btn ghost share-book" type="button" data-share="\${book.id}">Compartilhar</button></div></div></article>\`'
    );

    html=html.replace(
      "grid.querySelectorAll('[data-read]').forEach(btn=>btn.addEventListener('click',()=>openReader(btn.dataset.read)));renderPdfCovers()}",
      "grid.querySelectorAll('[data-read]').forEach(btn=>btn.addEventListener('click',()=>openReader(btn.dataset.read)));grid.querySelectorAll('[data-share]').forEach(btn=>btn.addEventListener('click',()=>shareBook(btn.dataset.share)));renderPdfCovers()}"
    );

    html=html.replace(
      'function getBook(id){return BOOKS.find(b=>b.id===id)}',
      'function shareBook(id){const book=getBook(id);if(!book)return;const url=location.href.split("#")[0]+"#"+id;const data={title:book.title,text:"Veja este livro na Biblioteca da Bárbara: "+book.title,url};if(navigator.share){navigator.share(data).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>alert("Link do livro copiado!"));}else{prompt("Copie o link deste livro:",url);}};function getBook(id){return BOOKS.find(b=>b.id===id)}'
    );

    html=html.replace(
      '<div class="detail-price"><small>Versão disponível</small><strong>PDF - R$ 39,90</strong></div><div class="actions"><button class="btn primary" id="readFromDetails">Ler prévia</button><a class="btn gold buy" id="buyFromDetails" href="#" target="_blank" rel="noopener">Adquirir PDF</a></div>',
      '<div class="detail-price"><small>Versão disponível</small><strong id="detailPdfPrice">PDF</strong><strong id="detailPhysicalPrice" style="display:none;font-size:19px;margin-top:6px"></strong></div><div class="actions"><button class="btn primary" id="readFromDetails">Ler prévia</button><a class="btn gold buy" id="buyFromDetails" href="#" target="_blank" rel="noopener">Adquirir PDF</a><a class="btn ghost" id="buyPhysicalFromDetails" href="#" target="_blank" rel="noopener" style="display:none">Adquirir livro físico</a><button class="btn ghost" id="shareFromDetails" type="button">Compartilhar</button></div>'
    );

    html=html.replace(
      'buyFromDetails.href=currentBook.buy;details.classList.add',
      'buyFromDetails.href=currentBook.buy;document.getElementById("detailPdfPrice").textContent="PDF - "+currentBook.price;const physicalPrice=document.getElementById("detailPhysicalPrice"),physicalBuy=document.getElementById("buyPhysicalFromDetails");if(currentBook.id==="novena-nossa-senhora-aparecida"){physicalPrice.textContent="Livro físico - R$ 49,90";physicalPrice.style.display="block";physicalBuy.href="'+PHYSICAL_URL+'";physicalBuy.style.display="inline-flex";}else{physicalPrice.style.display="none";physicalBuy.style.display="none";}details.classList.add'
    );

    html=html.replace(
      "readFromDetails.addEventListener('click',()=>currentBook&&openReader(currentBook.id));readerClose.addEventListener",
      "readFromDetails.addEventListener('click',()=>currentBook&&openReader(currentBook.id));document.getElementById('shareFromDetails').addEventListener('click',()=>currentBook&&shareBook(currentBook.id));readerClose.addEventListener"
    );

    html=html.replace(
      'year.textContent=new Date().getFullYear();renderBooks();',
      'year.textContent=new Date().getFullYear();renderBooks();if(location.hash){const sharedId=decodeURIComponent(location.hash.slice(1));if(getBook(sharedId))setTimeout(()=>openDetails(sharedId),0);}'
    );

    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('loading').textContent='Não foi possível abrir a biblioteca agora. Atualize a página e tente novamente.';
  }
})();
</script></body></html>
