<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca da Bárbara</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdfb}
#site{display:block;width:100%;height:100dvh;border:0;background:#fffdfb}
</style>
</head>
<body>
<iframe id="site" src="index(2).html" title="Biblioteca da Bárbara"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const style=d.createElement('style');
    style.textContent=`
      html,body{max-width:100%;overflow-x:hidden}
      .container{width:min(1180px,94%)}
      header{position:sticky;top:0}
      .header-inner{height:68px}
      .library{padding:42px 0 64px}
      .intro{max-width:720px;margin-bottom:28px}
      .intro h1{font-size:clamp(44px,5.5vw,64px);margin:6px 0 12px}
      .intro p{font-size:14px;max-width:650px}
      .books-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
      .book-card{padding:16px;border-radius:22px;box-shadow:0 14px 36px rgba(76,39,53,.10)}
      .cover-wrap{max-width:235px;padding:8px;margin:0 auto 18px;border-radius:16px}
      .cover-img{object-fit:contain;border-radius:11px;box-shadow:0 10px 24px rgba(48,28,36,.14)}
      .book-info h2{font-size:31px;line-height:1.02;margin:11px 0 6px}
      .subtitle{font-size:12.5px;line-height:1.45;margin-bottom:11px}
      .short-desc{font-size:12.5px;line-height:1.55;margin-bottom:14px}
      .meta{gap:6px;margin-bottom:14px}
      .meta span{padding:6px 8px;font-size:9px}
      .price-box,.price-options{margin-top:auto;margin-bottom:15px}
      .price-box strong{font-size:23px}
      .price-option strong{font-size:20px}
      .actions{gap:7px}
      .btn{min-height:42px;padding:10px 12px}
      .actions .physical-buy{background:#fff;border:1px solid #c7a86b;color:var(--wine-dark)}
      .detail-grid{grid-template-columns:170px 1fr}
      .modal-panel{width:min(760px,94%);padding:26px}
      footer{padding:22px 0}
      @media(max-width:980px){
        .books-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
        .book-card:last-child:nth-child(odd){grid-column:1/-1;width:min(100%,520px);justify-self:center}
      }
      @media(max-width:680px){
        .container{width:min(94%,540px)}
        .header-inner{height:auto;min-height:62px;padding:8px 0}
        .brand strong{font-size:19px}
        .brand-mark{width:38px;height:38px;border-radius:12px;font-size:23px}
        .mini-btn{padding:8px 10px;font-size:10px}
        .library{padding:30px 0 48px}
        .intro{margin-bottom:22px}
        .intro h1{font-size:46px}
        .intro p{font-size:13px;line-height:1.5}
        .books-grid{grid-template-columns:1fr;gap:18px}
        .book-card,.book-card:last-child:nth-child(odd){grid-column:auto;width:100%;max-width:520px;margin:0 auto;padding:15px}
        .cover-wrap{max-width:215px;margin-bottom:15px}
        .book-info h2{font-size:30px}
        .actions{grid-template-columns:1fr}
        .actions .buy,.actions .physical-buy{grid-column:auto}
        .actions .btn{width:100%}
        .detail-grid{grid-template-columns:1fr;gap:20px}
        .detail-grid>img{width:min(190px,65%);margin:auto}
        .detail-copy h2{font-size:31px}
        .modal-panel{padding:22px 15px;margin:2vh auto;max-height:96vh}
        .footer-inner{justify-content:center;text-align:center}
        .socials{justify-content:center}
      }
    `;
    d.head.appendChild(style);

    const physicalUrl='https://wa.me/5589981099602?text=Ol%C3%A1%2C%20B%C3%A1rbara%21%20Quero%20adquirir%20o%20livro%20f%C3%ADsico%20Novena%20de%20Nossa%20Senhora%20Aparecida%20por%20R%24%2049%2C90.';
    const cards=[...d.querySelectorAll('.book-card')];
    const novena=cards.find(c=>(c.querySelector('h2')?.textContent||'').toLowerCase().includes('nossa senhora aparecida'));
    if(novena){
      if(!novena.querySelector('.price-options')){
        const old=novena.querySelector('.price-box');
        if(old){
          const box=d.createElement('div');
          box.className='price-options';
          box.innerHTML='<div class="price-option"><span>PDF</span><strong>R$ 19,90</strong></div><div class="price-option"><span>Livro físico</span><strong>R$ 49,90</strong></div>';
          old.replaceWith(box);
        }
      }
      const actions=novena.querySelector('.actions');
      if(actions && !actions.querySelector('.physical-buy')){
        const a=d.createElement('a');
        a.className='btn physical-buy';
        a.href=physicalUrl;
        a.target='_blank';
        a.rel='noopener';
        a.textContent='Adquirir livro físico';
        actions.appendChild(a);
      }
      const detailsBtn=novena.querySelector('[data-details]');
      if(detailsBtn){
        detailsBtn.addEventListener('click',()=>{
          const price=d.getElementById('detailPrice');
          if(price) price.innerHTML='<small>Versões disponíveis</small><strong>PDF - R$ 19,90</strong><strong style="font-size:20px;margin-top:6px">Livro físico - R$ 49,90</strong>';
          const acts=d.querySelector('#detailModal .actions');
          let a=d.getElementById('buyPhysicalFromDetails');
          if(!a && acts){
            a=d.createElement('a');
            a.id='buyPhysicalFromDetails';
            a.className='btn physical-buy';
            a.target='_blank';
            a.rel='noopener';
            a.textContent='Adquirir livro físico';
            acts.appendChild(a);
          }
          if(a){a.href=physicalUrl;a.style.display='inline-flex'}
        });
      }
    }
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
