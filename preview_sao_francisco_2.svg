<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491"><rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="5"/><text x="527.5" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#b18a4c">✝</text><text x="527.5" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="82" font-weight="700" fill="#4a2416">Como rezar esta novena</text><text x="527.5" y="325" text-anchor="middle" font-family="Georgia,serif" font-size="39" font-style="italic" fill="#42552f">Reze com fé, silêncio e confiança.</text><g font-family="Georgia,serif" fill="#4a2416" font-size="29"><text x="120" y="470"><tspan font-weight="700">1. Prepare o coração</tspan><tspan x="120" dy="48">Escolha um momento de silêncio e faça o Sinal da Cruz.</tspan></text><text x="120" y="625"><tspan font-weight="700">2. Apresente sua intenção</tspan><tspan x="120" dy="48">Confie ao Senhor seus pedidos e agradecimentos.</tspan></text><text x="120" y="780"><tspan font-weight="700">3. Reze o dia correspondente</tspan><tspan x="120" dy="48">Leia a história, a Palavra, a reflexão, a intenção e a oração.</tspan></text><text x="120" y="935"><tspan font-weight="700">4. Reze juntamente com o Santo Terço</tspan><tspan x="120" dy="48">Durante os 9 dias, una a novena à oração do Terço.</tspan></text><text x="120" y="1090"><tspan font-weight="700">5. Viva o propósito do dia</tspan><tspan x="120" dy="48">Transforme a oração em um gesto concreto.</tspan></text><text x="120" y="1245"><tspan font-weight="700">6. Conclua com confiança</tspan><tspan x="120" dy="48">Reze Pai-Nosso, Ave-Maria e Glória.</tspan></text></g></svg>