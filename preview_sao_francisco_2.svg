<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491">
<rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="4"/>
<text x="527" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#a57a37">✝</text>
<text x="527" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#a57a37">NOVENA DE</text>
<text x="527" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="55" font-weight="700" fill="#442116">SÃO FRANCISCO DE ASSIS</text>
<line x1="120" y1="240" x2="935" y2="240" stroke="#b18a4c" stroke-width="2"/>
<text x="110" y="340" font-family="Georgia,serif" font-size="68" font-weight="700" fill="#442116">Como rezar</text>
<text x="110" y="414" font-family="Georgia,serif" font-size="68" font-weight="700" fill="#442116">esta novena</text>
<text x="110" y="475" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#40512c">Reze com fé, silêncio e confiança.</text>
<g font-family="Georgia,serif" fill="#4b2a1c">
<circle cx="112" cy="570" r="34" fill="#7b652c"/><text x="112" y="582" text-anchor="middle" font-size="30" fill="#fff">1</text>
<text x="175" y="555" font-size="34" font-weight="700" fill="#314325">Prepare o coração</text><text x="175" y="600" font-size="26">Escolha um momento de silêncio e recolhimento.</text><text x="175" y="635" font-size="26">Coloque-se na presença de Deus e faça o Sinal da Cruz.</text>
<circle cx="112" cy="720" r="34" fill="#7b652c"/><text x="112" y="732" text-anchor="middle" font-size="30" fill="#fff">2</text>
<text x="175" y="705" font-size="34" font-weight="700" fill="#314325">Apresente sua intenção</text><text x="175" y="750" font-size="26">Ofereça a novena por uma intenção especial, confiando ao Senhor</text><text x="175" y="785" font-size="26">seus pedidos, agradecimentos e necessidades.</text>
<circle cx="112" cy="870" r="34" fill="#7b652c"/><text x="112" y="882" text-anchor="middle" font-size="30" fill="#fff">3</text>
<text x="175" y="855" font-size="34" font-weight="700" fill="#314325">Reze o dia correspondente</text><text x="175" y="900" font-size="26">Leia a história, a Palavra de Deus, a reflexão, a intenção e a oração.</text>
<circle cx="112" cy="1000" r="34" fill="#7b652c"/><text x="112" y="1012" text-anchor="middle" font-size="30" fill="#fff">4</text>
<text x="175" y="985" font-size="34" font-weight="700" fill="#314325">Reze juntamente com o Santo Terço</text><text x="175" y="1030" font-size="26">Durante os 9 dias, una esta novena à oração do Santo Terço.</text>
<circle cx="112" cy="1130" r="34" fill="#7b652c"/><text x="112" y="1142" text-anchor="middle" font-size="30" fill="#fff">5</text>
<text x="175" y="1115" font-size="34" font-weight="700" fill="#314325">Viva o propósito do dia</text><text x="175" y="1160" font-size="26">Coloque em prática o pequeno gesto proposto em “Vivendo como Francisco”.</text>
<circle cx="112" cy="1260" r="34" fill="#7b652c"/><text x="112" y="1272" text-anchor="middle" font-size="30" fill="#fff">6</text>
<text x="175" y="1245" font-size="34" font-weight="700" fill="#314325">Conclua com confiança</text><text x="175" y="1290" font-size="26">Reze Pai-Nosso, Ave-Maria e Glória e permaneça alguns instantes em silêncio.</text>
</g>
<rect x="70" y="1340" width="915" height="90" rx="16" fill="#f5e8c9" stroke="#a57a37" stroke-width="2"/>
<text x="527" y="1380" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#4a2a1c">Importante: esta novena é rezada juntamente com o Santo Terço.</text>
<text x="527" y="1414" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-style="italic" fill="#40512c">Que São Francisco interceda por você e o conduza à paz, fraternidade e amor a Deus.</text>
</svg>