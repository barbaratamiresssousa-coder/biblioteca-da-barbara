<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491"><rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="5"/><text x="527.5" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#b18a4c">✝</text><text x="527.5" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="50" fill="#b18a4c">DIA 3</text><text x="527.5" y="315" text-anchor="middle" font-family="Georgia,serif" font-size="62" font-weight="700" fill="#4a2416">O encontro com os pobres e os doentes</text><text x="105" y="465" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Um pouco da história</text><text x="105" y="525" font-family="Georgia,serif" font-size="29" fill="#4a2416"><tspan x="105">Ao se aproximar dos pobres e dos leprosos, Francisco viveu</tspan><tspan x="105" dy="44">uma das mudanças mais profundas de sua vida e começou a</tspan><tspan x="105" dy="44">descobrir o rosto de Cristo nos mais sofredores.</tspan></text><text x="105" y="750" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Palavra de Deus</text><text x="105" y="810" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#4a2416">“Tudo o que fizestes a um destes meus irmãos mais pequeninos,</text><text x="105" y="855" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#4a2416">foi a mim que o fizestes.”</text><text x="105" y="900" font-family="Georgia,serif" font-size="34" fill="#4a2416">(cf. Mt 25,40)</text><text x="105" y="1035" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Reflexão</text><text x="105" y="1095" font-family="Georgia,serif" font-size="29" fill="#4a2416"><tspan x="105">O amor verdadeiro nos aproxima da dor do próximo e nos ensina</tspan><tspan x="105" dy="44">a servir com compaixão, humildade e misericórdia.</tspan></text></svg>