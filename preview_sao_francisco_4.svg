<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491"><rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="5"/><text x="527.5" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#b18a4c">✝</text><text x="527.5" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="50" fill="#b18a4c">DIA 2</text><text x="527.5" y="325" text-anchor="middle" font-family="Georgia,serif" font-size="70" font-weight="700" fill="#4a2416">Quando Deus mudou seus planos</text><text x="105" y="465" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Um pouco da história</text><text x="105" y="525" font-family="Georgia,serif" font-size="29" fill="#4a2416"><tspan x="105">Francisco sonhava com glórias humanas e desejava tornar-se</tspan><tspan x="105" dy="44">cavaleiro. Após a guerra e um tempo de enfermidade, percebeu</tspan><tspan x="105" dy="44">que Deus o chamava para um caminho novo.</tspan></text><text x="105" y="750" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Palavra de Deus</text><text x="105" y="810" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#4a2416">“Muitos são os planos no coração do homem, mas é a vontade</text><text x="105" y="855" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#4a2416">do Senhor que permanece.”</text><text x="105" y="900" font-family="Georgia,serif" font-size="34" fill="#4a2416">(cf. Pr 19,21)</text><text x="105" y="1035" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#42552f">Reflexão</text><text x="105" y="1095" font-family="Georgia,serif" font-size="29" fill="#4a2416"><tspan x="105">Somos convidados a confiar mesmo quando Deus muda os nossos</tspan><tspan x="105" dy="44">caminhos e não compreendemos tudo imediatamente.</tspan></text></svg>