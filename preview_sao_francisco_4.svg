<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="1491" viewBox="0 0 1055 1491">
<rect width="1055" height="1491" fill="#f8efd9"/><rect x="36" y="36" width="983" height="1419" fill="none" stroke="#b18a4c" stroke-width="4"/>
<text x="527" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="38" fill="#a57a37">NOVENA DE</text><text x="527" y="142" text-anchor="middle" font-family="Georgia,serif" font-size="53" font-weight="700" fill="#442116">SÃO FRANCISCO DE ASSIS</text>
<rect x="205" y="190" width="210" height="62" rx="30" fill="#52602f"/><text x="310" y="233" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#fff">DIA 2</text>
<text x="100" y="320" font-family="Georgia,serif" font-size="57" font-weight="700" fill="#442116">Quando Deus</text><text x="100" y="382" font-family="Georgia,serif" font-size="57" font-weight="700" fill="#442116">mudou seus planos</text>
<circle cx="830" cy="285" r="120" fill="#e5c88d"/><circle cx="840" cy="235" r="36" fill="#c99568"/><path d="M805 230 C818 190 862 190 875 228 C855 214 830 212 805 230Z" fill="#4c2f25"/><path d="M780 300 Q835 260 900 305 L890 385 L780 385Z" fill="#7b3f2c"/>
<g font-family="Georgia,serif" fill="#4a2a1c">
<text x="100" y="490" font-size="34" font-weight="700" fill="#314325">Um pouco da história</text>
<text x="100" y="535" font-size="25">Francisco sonhava com glórias humanas e desejava tornar-se cavaleiro. Porém,</text><text x="100" y="568" font-size="25">após uma guerra e um tempo de enfermidade, começou a perceber que seus planos</text><text x="100" y="601" font-size="25">não preenchiam seu coração. No silêncio da dor, Deus começou a chamá-lo para</text><text x="100" y="634" font-size="25">um caminho novo.</text>
<text x="100" y="720" font-size="34" font-weight="700" fill="#314325">Palavra de Deus</text>
<text x="100" y="764" font-size="25" font-style="italic">“Muitos são os planos no coração do homem, mas é a vontade do Senhor</text><text x="100" y="797" font-size="25" font-style="italic">que permanece.”</text><text x="100" y="830" font-size="24">(cf. Pr 19,21)</text>
<text x="100" y="910" font-size="34" font-weight="700" fill="#314325">Reflexão</text>
<text x="100" y="954" font-size="25">Às vezes, Deus permite mudanças e provações para nos conduzir ao que realmente</text><text x="100" y="987" font-size="25">importa. Francisco descobriu que nem sempre aquilo que desejamos é o melhor para</text><text x="100" y="1020" font-size="25">nossa alma. Também nós somos convidados a confiar quando Deus muda nossos caminhos.</text>
<text x="100" y="1100" font-size="34" font-weight="700" fill="#314325">Intenção do dia</text>
<text x="100" y="1144" font-size="25">Peçamos a graça de aceitar a vontade de Deus com humildade e de reconhecer</text><text x="100" y="1177" font-size="25">sua presença mesmo nos momentos difíceis.</text>
<text x="100" y="1252" font-size="34" font-weight="700" fill="#314325">Oração</text>
<text x="100" y="1296" font-size="24">São Francisco de Assis, ajudai-me a confiar nos planos de Deus para minha vida.</text><text x="100" y="1328" font-size="24">Quando eu me sentir perdido(a) ou decepcionado(a), ensinai-me a seguir com fé e paz. Amém.</text>
</g>
<rect x="70" y="1360" width="425" height="72" rx="14" fill="#f4e6c6" stroke="#a57a37" stroke-width="2"/><text x="95" y="1390" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#4a2a1c">Rezar também:</text><text x="95" y="1418" font-family="Georgia,serif" font-size="20" fill="#4a2a1c">Pai-Nosso, Ave-Maria e Glória.</text>
<rect x="530" y="1360" width="455" height="72" rx="14" fill="#f4e6c6" stroke="#a57a37" stroke-width="2"/><text x="555" y="1390" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#314325">Vivendo como Francisco:</text><text x="555" y="1418" font-family="Georgia,serif" font-size="19" fill="#4a2a1c">Entregue a Deus um plano seu e confie na vontade d’Ele.</text>
</svg>